name: Release Android & Windows Backup System

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android-app/release-keystore.jks
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Signed Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'personalbackup123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'personalbackup' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'personalbackup123' }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version || 'v1.0.8' }}"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          echo "Building APK for version $CLEAN_VER (run number ${{ github.run_number }})"
          cd android-app
          ./gradlew assembleRelease -PappVersionName="$CLEAN_VER" -PappVersionCode="${{ github.run_number }}" --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp android-app/app/build/outputs/apk/release/app-release.apk release-artifacts/personal-backup.apk
          cd release-artifacts
          sha256sum personal-backup.apk > personal-backup.apk.sha256
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version || 'v1.0.8' }}"
          fi
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            ### Personal Backup System Update ${{ env.RELEASE_TAG }}
            - Over-The-Air automatic update package
            - Continuous gallery & media protection
            - Forensic trash and thumbnail recovery
          files: |
            release-artifacts/personal-backup.apk
            release-artifacts/personal-backup.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
